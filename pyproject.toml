[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lens-raytrace"
version = "0.1.0"
description = "Exact 3D ray tracing through lenses and mirrors: Snell's law, focal lengths, aberrations, spot diagrams and dispersion"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luis Rodriguez" }]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
notebooks = ["matplotlib", "jupyter"]

[tool.setuptools]
packages = ["raytrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
